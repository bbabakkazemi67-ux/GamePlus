<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age of Persia V11</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .cover {
      width: 100%;
      max-width: 650px;
      height: 330px;
      margin: auto;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(135deg, #171717, #7a3b12, #d19a38);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.5);
    }

    .cover svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      margin-top: 25px;
      font-size: 32px;
    }

    .version {
      color: #bbb;
      margin-bottom: 25px;
    }

    .download {
      display: inline-block;
      background: #e59b2f;
      color: #111;
      padding: 15px 35px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .download:hover {
      background: #ffb84d;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- تصویر بازی -->
    <div class="cover">
      <svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">

        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#111"/>
            <stop offset="55%" stop-color="#573016"/>
            <stop offset="100%" stop-color="#d09a3b"/>
          </linearGradient>
        </defs>

        <rect width="900" height="450" fill="url(#bg)"/>

        <!-- کوه‌ها -->
        <polygon points="0,390 180,180 330,390" fill="#191919"/>
        <polygon points="230,390 470,130 700,390" fill="#242424"/>
        <polygon points="500,390 720,190 900,390" fill="#151515"/>

        <!-- خورشید -->
        <circle cx="700" cy="120" r="65"
                fill="#e4a83d" opacity="0.9"/>

        <!-- جنگجو -->
        <circle cx="450" cy="170" r="42" fill="#171717"/>
        <path d="M390 390 Q450 210 510 390 Z" fill="#101010"/>
        <rect x="438" y="195" width="24" height="130" fill="#b9b9b9"/>
        <polygon points="450,125 420,195 480,195" fill="#333"/>

        <!-- نوشته -->
        <text x="450" y="65"
              text-anchor="middle"
              font-size="42"
              font-family="Arial"
              font-weight="bold"
              fill="#ffffff">
          AGE OF PERSIA
        </text>

        <text x="450" y="425"
              text-anchor="middle"
              font-size="30"
              font-family="Arial"
              font-weight="bold"
              fill="#f0b84b">
          V11
        </text>

      </svg>
    </div>

    <h1>Age of Persia V11</h1>

    <div class="version">
      نسخه V11
    </div>

    <a class="download"
       href="https://drive.google.com/FILE-LINK-HERE"
       target="_blank">
      دانلود بازی
    </a>

  </div>

</body>
</html>
